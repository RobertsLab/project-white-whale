# Roberts Lab "Magallana gigas Epigenomics" umbrella BioProject (PRJNA213124):
# bisulfite sequencing from three studies deposited 2013-2015 under one
# project. Pooled-individual gill (Gavery & Roberts 2013), one deep male
# gonad library (Olson & Roberts 2014), and the family study of Olson &
# Roberts (2014 preprint): gonad of two males (1, 3) and their larvae at 72 and
# 120 hpf. Processed together as one study; the three parts differ in
# chemistry detail, depth and layout (see quality_flags and limitations).

study_id: ROBERTSLAB2013_EPIGENOMICS_WGBS
aree_study_id: null

accessions:
  bioproject: "PRJNA213124"
  sra: "SRP028178"
  ena: null
  geo: null
  doi: "10.3389/fphys.2014.00224"
  pmid: "24987376"
  other: "Gill library: Gavery & Roberts 2013, PeerJ, doi 10.7717/peerj.215, PMID 24282674. Family/larvae libraries: Olson & Roberts, bioRxiv doi 10.1101/012831 (posted 2014-12-16)."

citation: >
  Gavery MR, Roberts SB (2013). Predominant intragenic methylation is
  associated with gene expression characteristics in a bivalve mollusc. PeerJ
  1:e215. Olson CE, Roberts SB (2014). Genome-wide profiling of DNA
  methylation and gene expression in Crassostrea gigas male gametes. Front
  Physiol 5:224. Olson CE, Roberts SB (2014). Indication of family-specific
  DNA methylation patterns in developing oysters. bioRxiv 012831.
species: "Magallana gigas"
population: "Puget Sound, WA, USA. Gill pool collected 2012-07 (BioSample isolation_source Oyster Bay, South Puget Sound); family-study adults and larvae collected 2013-05 (geo_loc_name USA: Thorndyke Bay; one label names Samish Bay). Hatchery or wild origin not stated in the deposit."
original_assembly: null

chemistry: wgbs
library_layout: mixed
platform: "Illumina HiSeq 2000. Gill: single-end, one run (4.8 GB). Deep male gonad: paired-end, one run (22 GB). Family study: paired-end, 6 libraries in 12 runs (0.2-0.7 GB per run)."

samples:
  n_runs: 14
  n_libraries: 8
  sample_unit: pool
  pool_size: null
  tissues: [gill, gonad, whole_body]
  life_stages: [adult, d_larva]
  sexes_recorded: true
  ploidy: []

paired_rnaseq:
  relationship: related
  bioproject: "PRJNA213124"
  notes: "Two RNA-seq runs in the same BioProject: SRR1015813 (gill, pooled individuals; Gavery & Roberts 2013) and SRR1047762 (male gonad; Olson & Roberts 2014). Each matches one methylation library from the same tissue source, but there is one library per side and none for the larvae or the two family males. Check against the papers whether they are the same animals before using them for Goal 2."

factors:
  - factor_id: sample_type
    factor_original: "Run experiment_title: gill (pooled adults), male gonad, larvae 72 hpf, larvae 120 hpf"
    factor_standardized: development
    levels: [Gill, gonad, larvae_72, larvae_120]
    reference_level: gonad
  - factor_id: family
    factor_original: "Run experiment_title: 'Male 1' vs 'Male 3', the sire of each larval pool and the source of each family gonad library (Olson & Roberts 2014 preprint)"
    factor_standardized: genotype_or_population
    levels: ["1", "3"]
    reference_level: "1"

goals: [1, 2]

data_availability:
  raw_data_available: true
  fastq_size_gb: 32.4
  published_dml_dmr_tables: null
  access_notes: "Raw FASTQ for all 14 bisulfite runs public in SRA/ENA (first public 2013-11-13 to 2015-06-05). Sizes from ENA's fastq_bytes."

quality_flags:
  - pooled_libraries
  - shared_biosample
  - low_replication
  - mixed_read_lengths
  - confounded_design
  - enrichment_assay
  - no_spike_in

limitations: >
  (1) Three separate experiments share one BioProject. Tissue is confounded
  with year, library protocol, layout and depth: the gill library is 2013
  single-end, the deep gonad library is 2014 paired-end at ~22 GB, and the
  family libraries are 2014-2015 paired-end at under 1 GB per run. (2) The
  gill library is "methylation-enriched bisulfite sequencing" (the run's
  experiment_title; Gavery & Roberts 2013): methylated DNA was enriched
  before bisulfite conversion, so its per-CpG levels are biased upward and
  it is not comparable with the unenriched libraries. The enrichment_assay
  flag refers to that library only. (3) Gill and larval libraries pool
  several animals; pool sizes are not in the deposit. (4) One library per
  group for gill and deep gonad, two (one per family) for the others. (5)
  Coverage of the family libraries is low (tens of millions of reads at
  most), so per-CpG calls will be sparse. (6) No unmethylated spike-in is
  recorded; conversion has to be estimated from non-CpG context.

provenance:
  registered_by: "Steven Roberts"
  date_registered: "2026-10-23"
  curation_notes: >
    Claimed with `whale start-study --accession PRJNA213124 --study-id
    ROBERTSLAB2013_EPIGENOMICS_WGBS --profile desktop` on a lab Mac, data on
    the ugreen-2TB drive. The study ID names the lab rather than one first
    author because the BioProject holds three papers' data; the year is the
    first release (2013). Sample sheet generated with `whale
    fetch-samplesheet --bioproject PRJNA213124 --label-field
    experiment_title --label-pattern
    '(?i)(?P<material>gill|gonad|larvae \d+)(?:.*?Male(?: oyster)? (?P<male>\d))?'
    --condition-attribute material --attribute male --attribute sex
    --attribute collection_date --attribute geo_loc_name`: 14 Bisulfite-Seq
    runs, 8 libraries, 8 BioSamples; conditions Gill (1 library / 1 run),
    gonad (3 / 5; the deep library has no male number), larvae_72 (2 / 4),
    larvae_120 (2 / 4). The BioSample attributes do not separate 72 from
    120 hpf (both "D-hinge larvae"), so the run titles are used. Tissue
    "male gametes/spermatozoa" in the deposit is recorded as gonad; larval
    pools as whole_body. The two RNA-Seq runs were left out of the sheet.
    No exclusions.
  source_links:
    - "https://www.ncbi.nlm.nih.gov/bioproject/PRJNA213124"
    - "https://www.ebi.ac.uk/ena/browser/view/PRJNA213124"
    - "https://doi.org/10.7717/peerj.215"
    - "https://doi.org/10.3389/fphys.2014.00224"
    - "https://doi.org/10.1101/012831"
