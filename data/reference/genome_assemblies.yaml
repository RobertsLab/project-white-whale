# Every sample in White Whale is mapped to the `default: true` assembly, so
# coordinates and gene IDs are comparable by construction (PLAN.md §2). Other
# entries exist only so a study's *original* assembly can be recorded.
# Accession details copied from AREE's data/reference/genome_assemblies.yaml
# (verified there against the NCBI Datasets API on 2026-08-28).
version: "0.1.0"
assemblies:
