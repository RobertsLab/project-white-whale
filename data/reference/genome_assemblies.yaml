    ncbi_assembly_accession: "GCF_963853765.1"
    genbank_accession: "GCA_963853765.1"
    species: "Magallana gigas"
    ncbi_taxid: 29159
    annotation_release: "GCF_963853765.1-RS_2024_06"
    default: true
  - assembly_id: "cgigas_uk_roslin_v1"
