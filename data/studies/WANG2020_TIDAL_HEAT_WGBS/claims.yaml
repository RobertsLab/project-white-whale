study_id: WANG2020_TIDAL_HEAT_WGBS
sources:
  - id: P1
    citation: "Wang X, Li A, Wang W, Que H, Zhang G, Li L (2021). DNA methylation mediates differentiation in thermal responses of Pacific oyster (Crassostrea gigas) derived from different tidal levels. Heredity 126:10-22."
    doi: "10.1038/s41437-020-0351-7"
    read: "full text (PMC7852555 HTML, incl. Table 1 and figure legends) and both supplements (ESM1 .doc: Figs S1-S7 legends only, figure images not inspected; ESM2 .pdf: Tables S1-S4 in full)"
notes: >
  Paper's methylation level (ML) = methylated/(methylated+unmethylated) reads,
  computed in 10 kb bins and corrected for the lambda non-conversion rate
  (~0.11%). DMGs = genes whose gene body (TSS-TES) or promoter (2 kb upstream
  of TSS) overlaps >=1 bp of a DSS DMR (smoothing span 200, p < 1e-5,
  minlen 50, minCG 3, pct.sig 0.5); no FDR. The InC vs SubC DMGs pool CG, CHG
  and CHH contexts. Gene IDs are CGI_ (oyster_v9, Zhang et al. 2012 genome).
  Libraries: 3 pools of 5 gill samples per group (InC, InH, SubC, SubH).
claims:
  - id: C1
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a"
    statement: "Intertidal control oysters (InC) had a mean CpG methylation level of 15.0%."
    kind: global_level
    check: {level_pct: 15.0, groups: {origin: In, temperature: C}, measure: "mean CpG methylation level of the 3 InC libraries (10-kb-bin ML, corrected for lambda non-conversion)"}
  - id: C2
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a"
    statement: "Subtidal control oysters (SubC) had a mean CpG methylation level of 14.5%."
    kind: global_level
    check: {level_pct: 14.5, groups: {origin: Sub, temperature: C}, measure: "mean CpG methylation level of the 3 SubC libraries (10-kb-bin ML, corrected for lambda non-conversion)"}
  - id: C3
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a"
    statement: "Heat-shocked intertidal oysters (InH) had a mean CpG methylation level of 13.4%."
    kind: global_level
    check: {level_pct: 13.4, groups: {origin: In, temperature: H}, measure: "mean CpG methylation level of the 3 InH libraries"}
  - id: C4
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a"
    statement: "Heat-shocked subtidal oysters (SubH) had a mean CpG methylation level of 15.4%."
    kind: global_level
    check: {level_pct: 15.4, groups: {origin: Sub, temperature: H}, measure: "mean CpG methylation level of the 3 SubH libraries"}
  - id: C5
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a; Discussion para 2"
    statement: "In intertidal oysters, heat shock significantly lowered global CpG methylation (InC 15.0% vs InH 13.4%, ANOVA P < 0.05, n = 3 pools each)."
    kind: group_difference
    check: {factor: temperature, higher: C, lower: H, difference_pct: 1.6, stratum: {origin: In}, significance: "P < 0.05"}
  - id: C6
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a; Discussion para 2"
    statement: "In subtidal oysters, heat shock slightly raised global CpG methylation (SubC 14.5% vs SubH 15.4%); the paper calls this slight and gives no significance."
    kind: group_difference
    check: {factor: temperature, higher: H, lower: C, difference_pct: 0.9, stratum: {origin: Sub}, significance: "not stated"}
  - id: C7
    source: P1
    where: "Results, Global methylation pattern; Fig. 1a"
    statement: "Under control conditions intertidal oysters were marginally more methylated than subtidal oysters (15.0% vs 14.5%); no test of this difference is reported in the text."
    kind: group_difference
    check: {factor: origin, higher: In, lower: Sub, difference_pct: 0.5, stratum: {temperature: C}, significance: "not stated"}
  - id: C8
    source: P1
    where: "Results, Global methylation pattern"
    statement: "Non-CpG methylation was very low in control oysters: 0.20% of CHG and 0.16% of CHH sites methylated on average."
    kind: not_testable
    check: {reason: other_data, note: "Values are split by CHG and CHH context; our pipeline reports non-CpG methylation pooled per library, which can be compared only loosely (expect well under 1%). Our values are also uncorrected for conversion while the paper's are lambda-corrected."}
  - id: C9
    source: P1
    where: "Results, Global methylation pattern; Fig. 1b"
    statement: "Hierarchical clustering of the 12 methylomes grouped samples by tidal origin rather than by heat treatment (except two SubH samples that branched apart)."
    kind: clustering
    check: {factor: origin, component: "hierarchical clustering", statement: "samples cluster by origin (In vs Sub), not by temperature"}
  - id: C10
    source: P1
    where: "Results, Global methylation pattern; Fig. 1c"
    statement: "In PCA of the 12 samples, PC1 separated intertidal from subtidal oysters."
    kind: clustering
    check: {factor: origin, component: PC1, statement: "PC1 separates In from Sub samples"}
  - id: C11
    source: P1
    where: "Results, Global methylation pattern; Fig. 1c"
    statement: "PC2 separated heat-shocked from control samples, with the heat effect pointing in opposite directions for intertidal and subtidal oysters."
    kind: clustering
    check: {factor: temperature, component: PC2, statement: "PC2 separates H from C, with In and Sub shifting in opposite directions"}
  - id: C12
    source: P1
    where: "Results, Global methylation pattern; Fig. 1d; Discussion para 3"
    statement: "DAPC showed a larger heat-induced methylation shift (greater plasticity) in intertidal than subtidal oysters (MCMC P < 0.05), with intertidal shifting down and subtidal up."
    kind: not_testable
    check: {reason: other_data, note: "DAPC on gene methylation at common C sites with an MCMC mixed model of shift length; no comparable analysis in our outputs. The direction part overlaps C5/C6 and the per-gene direction claims C17/C19; an origin x temperature interaction is not a registered contrast."}
  - id: C13
    source: P1
    where: "Results, Correlation between DNA methylation status and gene expression; Fig. 3b; Discussion para 2"
    statement: "Methylation is concentrated in gene bodies, with other genomic regions less methylated."
    kind: region_contrast
    check: {higher: gene_body, lower: genome}
  - id: C14
    source: P1
    where: "Results; Fig. 3a-b, Fig. S2; Abstract"
    statement: "Gene-body methylation correlated positively with gene expression in all four groups; non-expressed genes had the lowest methylation and high/medium-expression genes the highest."
    kind: not_testable
    check: {reason: needs_rnaseq, note: "Uses matched RNA-seq (PRJNA407831) FPKM; no r value given in the text."}
  - id: C15
    source: P1
    where: "Results, Estimation of genotypic effect; Fig. 2"
    statement: "Libraries clustered genetically by tidal origin (SNPs from WGBS reads), but per-gene FST between InC and SubC was barely correlated with methylation difference (r = 0.02 gene body, 0.01 exon; 16,516 genes), so methylation divergence was argued to be largely independent of genotype."
    kind: not_testable
    check: {reason: other_data, note: "Requires SNP calling and FST per gene; not in our outputs."}
  - id: C16
    source: P1
    where: "Results, DNA methylation differentiation ... in response to heat stress; Fig. 6a"
    statement: "Heat shock in intertidal oysters gave 2137 DMGs (491 hyper, 1646 hypo in InH vs InC). The paper's Venn counts (788 shared + 1279 intertidal-unique = 2067) do not add up to this total."
    kind: dm_count
    check: {factor: temperature, level: H, stratum: {origin: In}, n: 2137, unit: DMGs, method: "DSS DMRs (p < 1e-5, minCG 3, minlen 50), gene body or 2-kb promoter overlapping a DMR; no FDR"}
  - id: C17
