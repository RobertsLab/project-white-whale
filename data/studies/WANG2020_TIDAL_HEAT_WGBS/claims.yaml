    kind: dm_count
    check: {factor: temperature, level: H, stratum: {origin: Sub}, n: 2459, unit: DMGs, method: "DSS DMRs (p < 1e-5, minCG 3, minlen 50), gene body or 2-kb promoter overlapping a DMR; no FDR"}
  - id: C19
    source: P1
    where: "Results; Fig. 6a; Abstract; Discussion para 4"
    statement: "Most heat-responsive DMGs in subtidal oysters were hypermethylated (1636 of 2459, 66.5%), opposite to intertidal oysters."
