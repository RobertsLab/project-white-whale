    statement: "Most heat-responsive DMGs in intertidal oysters were hypomethylated (1646 of 2137, 77%)."
    kind: dm_direction
    check: {factor: temperature, level: H, stratum: {origin: In}, direction: hypo, share_pct: 77.0}
