  - id: C20
    source: P1
    where: "Results, DNA methylation differentiation ... under temperate conditions; Fig. 4a; Fig. S3"
    statement: "Intertidal and subtidal control oysters differed in methylation at many genes (InC vs SubC DMGs, all C contexts), but the total number of DMGs is not reported, only the 90 that were also DEGs."
    kind: dm_count
    check: {factor: origin, level: In, stratum: {temperature: C}, n: null, unit: DMGs, method: "DSS DMRs in CG+CHG+CHH contexts, gene body or 2-kb promoter overlap; total not given in text"}
  - id: C21
    source: P1
    where: "Results; Fig. 5a-c"
    statement: "The opposite heat responses (InH below InC, SubH above SubC) held across promoter, exon, intron and repeat regions and in DMRs, and a heatmap of all DMRs clustered samples by tidal origin."
    kind: not_testable
    check: {reason: needs_other_regions, note: "Exon, intron, repeat and DMR-level summaries are not available; the promoter part is only indirectly reflected in the per-gene promoter direction counts of C17/C19."}
