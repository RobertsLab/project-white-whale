  statement: 'In F0 gastrulae (6 h of exposure) the methylation differences also leaned to hypomethylation: 60.7%
    of DMCs were hypomethylated in exposed embryos.'
  kind: not_testable
  check:
    reason: other_data
    note: Exposure factor not registered. Once registered, dm_direction on exposure E vs T within F0 gastrula; per-CpG
      unit in the paper.
    kind_if_registered: dm_direction
    factor: exposure
    level: E
    stratum:
      stage: gastrula
