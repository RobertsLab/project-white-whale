    direction: hypo
    share_pct: 60.7
- id: C3
  source: P1
  where: Highlights; Conclusion
  statement: Exposed F0 oysters show a global DNA demethylation during (gastrula) and after (MCP larva) the exposure
    window, i.e. lower methylation in exposed than in control animals; the paper supports this only with DMC direction,
    not with a reported global level.
  kind: not_testable
  check:
    reason: other_data
    note: Exposure factor not registered. Once registered, test as group_difference of overall CpG methylation per
      library, exposed lower than control, within F0 gastrula and F0 pediveliger separately. No numeric global levels
      are given in the paper.
    kind_if_registered: group_difference
    factor: exposure
    higher: T
    lower: E
    stratum:
      generation: F0
