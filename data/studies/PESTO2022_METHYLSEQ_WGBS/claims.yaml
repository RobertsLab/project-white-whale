design_note: 'No factors are registered. The design lives only in the sample sheet''s `condition` column (e.g. Gastrula_DNA_F1_ET:
  parents E, offspring T; T = control). Factor names used below are proposals for registration: `stage` (gastrula
  / pediveliger), `generation` (F0 / F1), `exposure` (offspring''s own 0-48 hpf exposure; reference "T", non-reference
  "E"), `parental_exposure` (F1 only; reference "T", non-reference "E"). Every differential claim is therefore `not_testable`
  (reason other_data) for now, and carries `kind_if_registered` plus the fields it would need. P2''s "lineage" contrasts
  pool both F1 exposure groups (CC+CE vs EC+EE). Both papers used GCA_902806645.1 (not the White Whale reference),
  methylKit, and per-CpG (P1) or 500 bp tile (P2) units, so even once factors are registered the counts are only
  comparable in direction and rough scale with per-gene DSS calls.

  '
