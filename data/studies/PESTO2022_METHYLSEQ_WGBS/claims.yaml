study_id: PESTO2022_METHYLSEQ_WGBS
sources:
- id: P1
  citation: Sol Dourdin T, Rivière G, Cormier A, Di Poi C, Guyomard K, Rabiller M, Akcha F, Bah TS, Le Monier P,
    Sussarellu R (2023). Molecular and phenotypic effects of early exposure to an environmentally relevant pesticide
    mixture in the Pacific oyster, Crassostrea gigas. Environmental Pollution 326:121472.
  doi: 10.1016/j.envpol.2023.121472
  read: Full text of the accepted author version (Ifremer Archimer 00829/94090), including methods, results, discussion
    and figure captions. The supplement (tab. SM1-SM5, fig. SM1-SM4, incl. the DMG list tab. SM4 and the cross-stage
    DMG table SM5) was not obtained, so no gene-level methylation claims could be taken from P1.
  libraries: 'F0: gastrula (6 hpf) and metamorphosis-competent pediveliger (MCP, 19 dpf) libraries; exposure 0-48
    hpf, control vs exposed. The paper analysed 10 gastrula libraries (4 control, 6 exposed; control tank C1 dropped
    for arrested development) and 12 MCP libraries (6 and 6).'
- id: P2
  citation: 'Sol Dourdin T, Guyomard K, Rabiller M, Houssais N, Cormier A, Le Monier P, Sussarellu R, Rivière G
    (2024). Ancestors'' Gift: Parental Early Exposure to the Environmentally Realistic Pesticide Mixture Drives
    Offspring Phenotype in a Larger Extent Than Direct Exposure in the Pacific Oyster, Crassostrea gigas. Environmental
    Science & Technology 58(4):1865-1876.'
  doi: 10.1021/acs.est.3c08201
  read: 'Full text of the accepted author version (Ifremer Archimer 00872/98346), including the SI figure captions
    and the SI variant-splicing note bundled in that PDF; SI workbook es3c08201_si_002.xlsx from figshare 24994504
    (Tables SI3-SI7 read: DEG lists, interaction genes, DMR/DMG counts, interaction DMGs, DMG-and-DEG genes).'
  libraries: 'F1: CC, CE, EC, EE (first letter = parental F0 treatment, second = F1 exposure 0-48 hpf), 3 gastrula
    and 3 MCP (16 dpf) libraries each.'
caveats:
- The sample sheet has no separate columns for stage, generation and exposure, so no factors are registered and
  every differential claim waits for them; the claims carry the factor names they will use (stage, generation, exposure,
  parental_exposure).
claims:
- id: C1
  source: P1
  where: Abstract; Highlights; Discussion (demethylation trend, 77.1% of DMCs hypo in MCP larvae)
  statement: 'Early pesticide-mixture exposure significantly changed DNA methylation in F0 MCP larvae 17 days after
    exposure ended, with a demethylation trend: 77.1% of the 220 DMCs were hypomethylated in exposed larvae.'
  kind: not_testable
  check:
    reason: other_data
    note: Exposure factor not registered. Once registered, test as dm_direction on exposure E vs T within F0 pediveliger;
      paper's unit is DMCs (per-CpG), ours would be genes.
    kind_if_registered: dm_direction
    factor: exposure
    level: E
    stratum:
      stage: pediveliger
      generation: F0
    direction: hypo
    share_pct: 77.1
- id: C2
