study_id: VALDIVIESO2025_POMS_RS_EMSEQ
sources:
- id: P1
  citation: Valdivieso A, Morga B, Degremont L, Mege M, Courtay G, Dorant Y, Escoubas J-M, Gawra J, de Lorgeril
    J, Mitta G, Cosseau C, Vidal-Dupiol J (2025). DNA methylation landscapes before and after Pacific Oyster Mortality
    Syndrome are different within and between resistant and susceptible Magallana gigas. Science of the Total Environment
    962:178385.
  doi: 10.1016/j.scitotenv.2025.178385
  read: full text (HAL accepted manuscript, hal-04901984); supplementary workbook mmc10.xlsx Tables S1-S18 (S4,
    S5, S7, S9, S11, S13-S18 tallied); supplementary Figs S3 (global methylation) and S4 (PCA) viewed
caveats:
- The paper compares T1 with T0 within each phenotype; the shared model's time jobs pool both phenotypes (with each
  oyster as a block), so those verdicts are approximate and at most partly.
claims:
- id: C1
  source: P1
  where: Results 3.2; Fig. S3
  statement: Genome-wide CpG methylation is low, about 12-13 % per library (individual values roughly 11.5-13.6
    % in Fig. S3 across tissues, phenotypes and times); the paper gives no single number in the text, value read
    from the figure.
  kind: global_level
  check:
    level_pct: 12.6
    groups: all
    measure: global CpG methylation per sample (Bismark CpG calls, >=10x), read from Fig. S3 boxplots
- id: C2
  source: P1
  where: Results 3.2; Discussion 4.1; Fig. S3A
  statement: In gills, global methylation is consistently higher after POMS infection (T1) than before (T0), by
    about 0.54 percentage points.
  kind: group_difference
  check:
    factor: time
    higher: T1
    lower: T0
    difference_pct: 0.54
    stratum:
      tissue_type: G
- id: C3
  source: P1
  where: Results 3.2; Discussion 4.1; Fig. S3B
  statement: In mantle, global methylation is consistently higher at T1 than at T0, by about 0.48 percentage points.
  kind: group_difference
  check:
    factor: time
    higher: T1
    lower: T0
    difference_pct: 0.48
    stratum:
      tissue_type: M
- id: C4
  source: P1
  where: Results 3.2; Fig. S3A
  statement: Global methylation in gills is higher in susceptible than resistant oysters (one-way ANOVA across the
    four phenotype x time groups, F = 4.62, P = 0.005); in Fig. S3A the only group differing significantly is susceptible
    T1 (~13.2 % vs ~12.4-12.8 % for the others).
  kind: group_difference
  check:
    factor: phenotype_class
    higher: S
    lower: R
    stratum:
      tissue_type: G
- id: C5
  source: P1
  where: Results 3.2; Fig. S3B
  statement: Global methylation in mantle is higher in susceptible than resistant oysters (one-way ANOVA, F = 7.49,
    P = 0.002); in Fig. S3B the difference is driven by susceptible T1 (~12.9-13 %), while at T0 susceptible medians
    are slightly below resistant ones.
  kind: group_difference
  check:
    factor: phenotype_class
    higher: S
    lower: R
    stratum:
      tissue_type: M
- id: C6
  source: P1
  where: Results 3.2; Fig. S4
  statement: In PCAs of CpGs common to all samples (1,886,331 in gills, 1,806,224 in mantle), samples cluster mainly
    by source population (each oyster's T0 and T1 sit together; population 5, SC18, separates on PC1), PC1 and PC2
    each explaining about 8-11 % of variance.
  kind: clustering
  check:
    factor: population
    component: PC1/PC2
    statement: samples group by population (GT5 separated on PC1; GT1-GT4 spread on PC2), within each tissue
- id: C7
  source: P1
  where: Results 3.2; Fig. S4
  statement: 'Infection (time) has only a subtle effect on the methylation landscape: T0 and T1 samples do not separate
    in the PCA, nor do phenotypes.'
  kind: clustering
  check:
    factor: time
    component: PC1/PC2
    statement: no separation of T0 vs T1 (nor S vs R) on the leading PCs; paired samples from the same oyster lie
      together
