- id: C22
  source: P1
  where: Abstract; Discussion 4.1; Conclusion
  statement: Resistant and susceptible oysters already carry distinct methylation patterns before exposure (T0),
    irrespective of population origin; the paper reports no plain R-vs-S DMR count at T0, only the filtered epibiomarker
    sets (C24).
  kind: not_testable
  check:
    reason: other_data
    note: phenotype_class R vs S within time T0 is a registered contrast, but the paper gives no count or direction
      for it; only gene-level example is C20
- id: C23
  source: P1
  where: Abstract; Results 3.4; Fig. S7; Table S14
  statement: 31 immune-related genes carry DMRs after infection in all four tissue x phenotype comparisons (from
    222, 185, 181 and 284 immune-related DMR genes in S gills, R gills, S mantle, R mantle), with contrasting directions
    between phenotypes.
  kind: not_testable
  check:
    reason: other_data
    note: intersection of four stratified T1-vs-T0 gene lists filtered by the authors' immune-gene annotation; could
      be approximated as an overlap of our four per-gene time contrasts, but no kind covers overlap counts and the
      immune flag is author-curated
- id: C24
  source: P1
  where: Abstract; Results 3.5.1; Tables 1, S15, S16
  statement: 1998 candidate phenotype epibiomarker DMRs (1204 gills, 1030 in gene bodies; 794 mantle, 718 in gene
    bodies) meet |RT0-ST0| >= 20 %, |RT1-ST0| >= 20 % and |RT0-RT1| <= 5 %.
  kind: not_testable
  check:
    reason: needs_coordinates
    note: multi-criteria DMR filter on group means, not a single DSS contrast; per-region on paper genome coordinates
- id: C25
  source: P1
  where: Abstract; Results 3.5.2; Tables 2, S17, S18
  statement: 164 gene-body candidate site (POMS exposure) epibiomarkers (66 of 68 DMRs in gills, 98 of 128 in mantle)
    meet |ST0-RT0| <= 5 %, |ST0-RT1| >= 20 % and |RT0-RT1| >= 20 %; note the abstract's 164 counts gene-body DMRs
    while its 1998 counts all DMRs.
  kind: not_testable
  check:
    reason: needs_coordinates
    note: multi-criteria DMR filter on group means; per-region on paper genome coordinates
- id: C26
  source: P1
  where: Results 3.3.3, 3.3.6; Fig. S6C-H
  statement: 'Genes with DMRs after infection overlap between phenotypes: 527 in gills (277 with the same direction:
    157 hyper, 120 hypo) and 788 in mantle (384 same direction: 213 hyper, 171 hypo).'
  kind: not_testable
  check:
    reason: other_data
    note: overlap between two stratified time contrasts; no kind for gene-list overlap, though it could be approximated
      from our per-gene results
- id: C27
  source: P1
  where: Abstract; Results 3.3.1-3.3.6; Figs. 2-3
  statement: Genes with DMRs after infection are enriched for immunity, signalling, metabolism and transport GO
    terms and KEGG pathways (e.g. response to virus and DNA damage response in hypermethylated S-gill genes; mitophagy
    in hypermethylated R-gill genes).
  kind: not_testable
  check:
    reason: other_data
    note: GO_MWU / DAVID enrichment against the paper's annotation; enrichment is not part of the re-derived outputs
- id: C28
  source: P1
  where: Results 3.1; Fig. 1C; Fig. S2; Tables S1-S3
  statement: 'The cohabitation challenge worked: survival differed among populations (15 % in SC18/#5 to 85 % in
    Thau/#1, log-rank P <= 0.001), and at T1 OsHV-1 load was higher in susceptible than resistant tissues (Mann-Whitney
    W = 23, P = 0.032).'
  kind: not_testable
  check:
    reason: other_data
    note: survival and qPCR viral load, not methylation
