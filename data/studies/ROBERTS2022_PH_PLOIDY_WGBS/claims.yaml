notes: 'Model and strata: P1 fitted DSS DMLfit.multiFactor with formula ~ ploidy + pH + ploidy:pH and tested coefficients
  ploidyT, pHL and ploidyT:pHL separately (Wald test, FDR < 0.01, no smoothing, no effect-size cut-off). With R''s
  default treatment coding, the ploidyT coefficient is the triploid-vs-diploid effect at high pH (8.2) and pHL is
  the low-vs-high pH effect in diploids; the dissertation nevertheless interprets them as main effects. The strata
  below follow the model coding. Discrepancy: in R1 the file named DML-pH-DSS.csv has 154 rows and DML-ploidy-DSS.csv
  has 178 rows, the reverse of the counts stated in P1 (178 pH-DML, 154 ploidy-DML); the GO-enrichment loci for
  pH come from the 154-row file. Counts below follow the dissertation text. P1 states no direction (hyper/hypo)
  for any DML set. Design caveat: pH is confounded with tank and sampling day (one tank per pH).

  '
