name: Dashboard

# Rebuilds site/data.json from the repository, the study branches' claims and
# the gannet mirror ledgers, and publishes site/ to GitHub Pages. Claims and
# mirror progress change without a push to main, hence the schedule. It also
# rebuilds the cross-study atlas (site/atlas/data) from the studies on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build site/data.json
        run: whale build-dashboard
      # The atlas pools only what is merged to main, so it changes when a study PR merges.
      - name: Build site/atlas/data (pooled tables, landscape, concordance)
        run: whale build-atlas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
