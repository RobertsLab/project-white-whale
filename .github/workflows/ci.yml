name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Tests, lint, registry validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Validate every study registration and status file
        run: |
          whale validate-study
          whale validate-status
      - name: Rebuild the registry index
        run: whale build-registry

  study-scope:
    name: Study PR stays inside its own files
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'study/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check changed paths, study_id and accession
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: whale check-study-scope --branch "$HEAD_REF" --base "origin/$BASE_REF"

  nextflow:
    name: Methylation workflow (stub run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        env:
          NXF_VER: 26.04.7
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Run the DAG on the test fixtures
        run: nextflow run workflows/methylation -profile test -stub
      - name: Check the run manifest
        run: |
          test -s results/test/TEST2026_FIXTURE_WGBS/run_manifest.json
          test -s results/test/TEST2026_FIXTURE_WGBS/qc_summary.tsv
          test -s results/test/TEST2026_FIXTURE_WGBS/features/S1.features.tsv.gz
          ls results/test/TEST2026_FIXTURE_WGBS/cpg/S1.CpG_report.merged_CpG_evidence.cov.gz
      - name: Dropping a library from swap_mates re-runs it on -resume
        # Before the SNP mask run: -resume picks up the last session, whatever its workflow.
        run: |
          echo "params.swap_mates = []" > no_swap.config
          nextflow run workflows/methylation -profile test -stub -resume -c no_swap.config
          nextflow log last -f name,status | tee resume.tsv
          grep -qxP "TRIM_GALORE \(S3\)\tCOMPLETED" resume.tsv
          grep -qxP "TRIM_GALORE \(S1\)\tCACHED" resume.tsv
      - name: Run the SNP mask DAG on the stub BAMs
        run: nextflow run workflows/snp_mask -profile test -stub
      - name: Check the mask outputs
        run: |
          test -s results/test/snp_mask/mask_manifest.json
          test -s results/test/snp_mask/cpg_mask.bed.gz
      - name: Re-run the gene step with the SNP mask
        run: |
          nextflow run workflows/methylation -profile test -stub -resume --snp_mask results/test/snp_mask
          python3 -c "import json,sys; m=json.load(open('results/test/TEST2026_FIXTURE_WGBS/run_manifest.json'))['params']['snp_mask']; sys.exit(0 if m and m['mask_id']=='TEST.snpmask' else 1)"

  nextflow-real:
    # The stub run checks the DAG; this runs every real command, in the pinned
    # containers, on reads simulated with known methylation
    # (tests/fixtures/make_fixtures.py), and checks the calls against it.
    name: Methylation workflow (real run on fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Nextflow
        env:
          NXF_VER: 26.04.7
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
      - name: Run every step for real (Docker)
        run: nextflow run workflows/methylation -profile test,docker
      - name: Check the calls against the simulated methylation
        run: python3 tests/check_real_run.py results/test/TEST2026_FIXTURE_WGBS
      - name: Build the SNP mask against a reference with planted C/T SNPs
        run: |
          python3 tests/plant_snps.py results/test/snp_reference
          nextflow run workflows/snp_mask -profile test,docker --reference_dir results/test/snp_reference
      - name: Check the mask finds the planted SNPs
        run: python3 tests/plant_snps.py --check results/test/snp_reference results/test/snp_mask
